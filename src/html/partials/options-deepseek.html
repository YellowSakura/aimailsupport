<fieldset id="deepseek">
    <legend>DeepSeek:</legend>

    <div class="form-group">
        <label for="deepseekApiKey" data-l10n-ref="options.deepseek.apiKey">&nbsp;</label>
        <input id="deepseekApiKey" is="password-toggle" data-required>
        <div class="description" data-l10n-ref="options.deepseek.apiKey.description"></div>
    </div>

    <!-- https://api-docs.deepseek.com/quick_start/pricing -->
    <div class="form-group">
        <label for="deepseekModel" data-l10n-ref="options.deepseek.model">&nbsp;</label>
        <select id="deepseekModel" data-required>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
            <option selected value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        </select>
    </div>
</fieldset>
